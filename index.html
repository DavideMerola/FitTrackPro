<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag fondamentali per PWA e iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FitTrack">
    <title>FitTrack</title>

    <!-- Icona App Generata in automatico (FT - FitTrack con i colori del tema) -->
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=FT&background=0f172a&color=10b981&size=512&font-size=0.4&bold=true">
    <link rel="icon" type="image/png" href="https://ui-avatars.com/api/?name=FT&background=0f172a&color=10b981&size=512&font-size=0.4&bold=true">

    <!-- ICONA APP (Sostituisci l'href con il link a una tua immagine PNG 192x192 caricata su GitHub) -->
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/Dumbbell_icon.svg/512px-Dumbbell_icon.svg.png">
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/Dumbbell_icon.svg/512px-Dumbbell_icon.svg.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        accent: '#10b981',
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>

    <style>
        /* Blocco totale per iOS: l'app non deve avere "rimbalzi" strani */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            background-color: #0f172a;
        }
        body {
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
            overscroll-behavior: none; /* Impedisce il bounce effect su Chrome/Safari */
        }
        #root { height: 100%; width: 100%; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        /* Calcolo dinamico dello spazio di sicurezza (notch/isola dinamica e orologio) */
        .safe-top-padding { padding-top: max(env(safe-area-inset-top), 20px); }
        .safe-bottom-padding { padding-bottom: max(env(safe-area-inset-bottom), 20px); }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #10b981;">
            <h2>Caricamento FitTrack Pro...</h2>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const MUSCLE_GROUPS = [
            "Petto", "Dorso", "Schiena Alta", "Quadricipiti", "Femorali", "Adduttori", 
            "Deltoide anteriore", "Deltoide Laterale", "Deltoide Posteriore", 
            "Bicipiti", "Tricipiti", "Addome", "Polpacci", "Glutei"
        ];

        const MUSCLE_ABBR = {
            "Petto": "Pet", "Dorso": "Dor", "Schiena Alta": "Sch.A", "Quadricipiti": "Quad", 
            "Femorali": "Fem", "Adduttori": "Addut",
            "Deltoide anteriore": "D.Ant", "Deltoide Laterale": "D.Lat", "Deltoide Posteriore": "D.Pos", 
            "Bicipiti": "Bic", "Tricipiti": "Tri", "Addome": "Add", "Polpacci": "Pol", "Glutei": "Glu"
        };

        const VOLUME_LANDMARKS = { /* ... omitted for brevity in preview, unchanged ... */
            "Petto": { mev: "8-10", mav: "12-20", mrv: "22+" },
            "Dorso": { mev: "10", mav: "14-22", mrv: "25+" },
            "Schiena Alta": { mev: "10", mav: "14-22", mrv: "25+" },
            "Quadricipiti": { mev: "8", mav: "12-18", mrv: "20+" },
            "Femorali": { mev: "6", mav: "10-16", mrv: "20+" },
            "Adduttori": { mev: "6", mav: "10-14", mrv: "18+" },
            "Deltoide anteriore": { mev: "0-6", mav: "6-10", mrv: "12+" },
            "Deltoide Laterale": { mev: "8", mav: "16-22", mrv: "26+" },
            "Deltoide Posteriore": { mev: "8", mav: "14-20", mrv: "24+" },
            "Bicipiti": { mev: "8", mav: "14-20", mrv: "26+" },
            "Tricipiti": { mev: "6", mav: "10-14", mrv: "18+" },
            "Addome": { mev: "0-2", mav: "16-20", mrv: "25+" },
            "Polpacci": { mev: "8", mav: "12-16", mrv: "20+" },
            "Glutei": { mev: "0-4", mav: "4-12", mrv: "16+" }
        };

        const INITIAL_STATE = {
            routines: {
                'A': { id: 'A', name: 'Scheda A', exercises: [] },
                'B': { id: 'B', name: 'Scheda B', exercises: [] },
                'C': { id: 'C', name: 'Scheda C', exercises: [] }
            },
            history: []
        };

        const Icons = {
            Menu: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>,
            Plus: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Close: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Video: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>,
            Trash: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Check: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Info: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>,
            Chart: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></svg>,
            Up: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>,
            Down: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>,
            Circle: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle></svg>,
            CheckCircle: () => <svg width="24" height="24" fill="currentColor" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" className="text-accent"><circle cx="12" cy="12" r="10" fillOpacity="0.2"></circle><path d="M9 12l2 2 4-4" stroke="currentColor" strokeWidth="2"></path></svg>
        };

        // Finestra di dialogo personalizzata
        function CustomDialog({ dialog, onClose }) {
            const [inputValue, setInputValue] = useState('');
            
            useEffect(() => {
                if (dialog && dialog.type === 'prompt') setInputValue('');
            }, [dialog]);

            if (!dialog) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={dialog.type === 'alert' ? onClose : null}></div>
                    <div className="bg-card rounded-2xl p-6 w-full max-w-sm shadow-2xl relative z-10 border border-slate-700 animate-[pulse_0.2s_ease-out]">
                        <p className="text-white text-center mb-6 text-sm">{dialog.message}</p>
                        
                        {dialog.type === 'prompt' && (
                            <input 
                                type="text" 
                                autoFocus
                                className="w-full bg-dark text-white rounded-xl p-3 border border-slate-700 mb-6 focus:border-accent focus:outline-none"
                                value={inputValue}
                                onChange={(e) => setInputValue(e.target.value)}
                                placeholder={dialog.placeholder || "Scrivi qui..."}
                            />
                        )}

                        <div className="flex gap-3 justify-center">
                            {(dialog.type === 'confirm' || dialog.type === 'prompt') && (
                                <button onClick={dialog.onCancel} className="flex-1 bg-slate-700 text-slate-300 py-2 rounded-lg font-semibold active:bg-slate-600 transition-colors">
                                    Annulla
                                </button>
                            )}
                            <button onClick={() => dialog.type === 'prompt' ? dialog.onConfirm(inputValue) : dialog.onConfirm()} className="flex-1 bg-accent text-white py-2 rounded-lg font-semibold active:bg-emerald-600 transition-colors shadow-[0_0_10px_rgba(16,185,129,0.2)]">
                                OK
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- STREAMING_CHUNK:Componente App Principale e Stato... ---
        function App() {
            const [data, setData] = useState(() => {
                const savedData = localStorage.getItem('fitTrackData');
                if (savedData) {
                    try { 
                        const parsed = JSON.parse(savedData); 
                        if(!parsed.routines['C']) parsed.routines['C'] = { id: 'C', name: 'Scheda C', exercises: [] };
                        return parsed;
                    } catch(e) {}
                }
                return INITIAL_STATE;
            });

            const [activeRoutineId, setActiveRoutineId] = useState('A');
            const [currentView, setCurrentView] = useState('routine'); 
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingExercise, setEditingExercise] = useState(null);
            const [dialog, setDialog] = useState(null);
            
            // Nuovi stati richiesti
            const [showVolume, setShowVolume] = useState(false);
            const [completedExercises, setCompletedExercises] = useState({});

            useEffect(() => {
                localStorage.setItem('fitTrackData', JSON.stringify(data));
            }, [data]);

            // Resetta i check quando cambi scheda
            useEffect(() => {
                setCompletedExercises({});
            }, [activeRoutineId]);

            const todayStr = useMemo(() => {
                const options = { weekday: 'long', day: 'numeric', month: 'long' };
                let str = new Intl.DateTimeFormat('it-IT', options).format(new Date());
                return str.charAt(0).toUpperCase() + str.slice(1);
            }, []);

            const currentVolume = useMemo(() => {
                const stats = { primary: {}, secondary: {} };
                const routine = data.routines[activeRoutineId];
                if (!routine) return stats;
                
                routine.exercises.forEach(ex => {
                    const setsNum = parseInt(ex.sets, 10) || 0;
                    if (setsNum > 0) {
                        if (!stats.primary[ex.primaryMuscle]) stats.primary[ex.primaryMuscle] = 0;
                        stats.primary[ex.primaryMuscle] += setsNum;
                        
                        if (ex.secondaryMuscles && ex.secondaryMuscles.length > 0) {
                            ex.secondaryMuscles.forEach(sm => {
                                if (!stats.secondary[sm]) stats.secondary[sm] = 0;
                                stats.secondary[sm] += setsNum;
                            });
                        }
                    }
                });
                return stats;
            }, [data, activeRoutineId]);

            // --- STREAMING_CHUNK:Gestione Esercizi (Salvataggio, Spostamento)... ---
            const saveExercise = (exercise) => {
                setData(prev => {
                    const routine = prev.routines[activeRoutineId];
                    let newExercises = [...routine.exercises];

                    if (editingExercise) {
                        const index = newExercises.findIndex(e => e.id === exercise.id);
                        if (index !== -1) newExercises[index] = exercise;
                    } else {
                        newExercises.push({ ...exercise, id: Date.now().toString() });
                    }
                    return { ...prev, routines: { ...prev.routines, [activeRoutineId]: { ...routine, exercises: newExercises } } };
                });
                setIsModalOpen(false);
                setEditingExercise(null);
            };

            const deleteExercise = (id) => {
                setDialog({
                    type: 'confirm', message: "Vuoi eliminare questo esercizio?",
                    onCancel: () => setDialog(null),
                    onConfirm: () => {
                        setData(prev => {
                            const routine = prev.routines[activeRoutineId];
                            return {
                                ...prev, routines: { ...prev.routines, [activeRoutineId]: {
                                    ...routine, exercises: routine.exercises.filter(e => e.id !== id)
                                }}
                            };
                        });
                        setDialog(null);
                    }
                });
            };

            // Funzione per spostare gli esercizi (Sostituisce il Drag&Drop)
            const moveExercise = (index, direction) => {
                setData(prev => {
                    const routine = prev.routines[activeRoutineId];
                    const newExercises = [...routine.exercises];
                    
                    // Controlla i limiti
                    if (index + direction < 0 || index + direction >= newExercises.length) return prev;
                    
                    // Scambia gli elementi
                    const temp = newExercises[index];
                    newExercises[index] = newExercises[index + direction];
                    newExercises[index + direction] = temp;
                    
                    return { ...prev, routines: { ...prev.routines, [activeRoutineId]: { ...routine, exercises: newExercises } } };
                });
            };

            const toggleCompletion = (id) => {
                setCompletedExercises(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const finishWorkout = () => {
                const currentRoutine = data.routines[activeRoutineId];
                if(currentRoutine.exercises.length === 0) {
                    setDialog({ type: 'alert', message: "Aggiungi degli esercizi prima di terminare!", onConfirm: () => setDialog(null) });
                    return;
                }
                
                setDialog({
                    type: 'confirm',
                    message: "Vuoi salvare questo allenamento nello storico?",
                    onCancel: () => setDialog(null),
                    onConfirm: () => {
                        const workoutRecord = {
                            id: Date.now().toString(),
                            date: new Date().toISOString(),
                            dateStr: todayStr,
                            routineName: currentRoutine.name,
                            exercises: [...currentRoutine.exercises]
                        };

                        setData(prev => ({ ...prev, history: [workoutRecord, ...prev.history] }));
                        setCurrentView('history');
                        setCompletedExercises({}); // Resetta i check dopo aver terminato
                        setDialog(null);
                    }
                });
            };

            const addRoutine = () => {
                setDialog({
                    type: 'prompt',
                    message: 'Inserisci il nome della nuova scheda:',
                    placeholder: 'Es. Scheda Forza',
                    onCancel: () => setDialog(null),
                    onConfirm: (val) => {
                        if (!val || !val.trim()) {
                            setDialog(null);
                            return;
                        }
                        const newId = Date.now().toString();
                        setData(prev => ({
                            ...prev,
                            routines: {
                                ...prev.routines,
                                [newId]: { id: newId, name: val.trim(), exercises: [] }
                            }
                        }));
                        setActiveRoutineId(newId);
                        setCurrentView('routine');
                        setDialog(null);
                        setIsMenuOpen(false);
                    }
                });
            };

            const deleteRoutine = (id, name) => {
                const routineKeys = Object.keys(data.routines);
                if (routineKeys.length <= 1) {
                    setDialog({ type: 'alert', message: "Non puoi eliminare l'unica scheda rimasta.", onConfirm: () => setDialog(null) });
                    return;
                }
                setDialog({
                    type: 'confirm',
                    message: `Vuoi eliminare la scheda "${name}" e tutti i suoi esercizi?`,
                    onCancel: () => setDialog(null),
                    onConfirm: () => {
                        setData(prev => {
                            const newRoutines = { ...prev.routines };
                            delete newRoutines[id];
                            
                            // Se eliminiamo quella attualmente attiva, passiamo a un'altra
                            if (activeRoutineId === id) {
                                setActiveRoutineId(Object.keys(newRoutines)[0]);
                            }
                            return { ...prev, routines: newRoutines };
                        });
                        setDialog(null);
                    }
                });
            };

            const activeRoutine = data.routines[activeRoutineId] || Object.values(data.routines)[0];

            // --- STREAMING_CHUNK:Rendering UI Principale... ---
            return (
                <div className="h-full w-full flex flex-col relative text-sm sm:text-base">
                    
                    {/* TOP BAR - Ora usa padding dinamico per iPhone */}
                    <div className="bg-card safe-top-padding pb-3 px-4 border-b border-slate-700 flex justify-between items-end z-20 shadow-md shrink-0">
                        <button onClick={() => setIsMenuOpen(true)} className="p-2 -ml-2 text-slate-300 hover:text-white active:scale-95 transition-transform">
                            <Icons.Menu />
                        </button>
                        
                        <div className="text-center pb-1">
                            <h1 className="text-lg font-bold text-white tracking-wide">
                                {currentView === 'routine' ? activeRoutine.name : 
                                 currentView === 'history' ? 'Storico' : 
                                 currentView === 'landmarks' ? 'Landmark' : 'Analisi'}
                            </h1>
                            <p className="text-xs text-accent font-medium leading-none mt-1">{todayStr}</p>
                        </div>

                        {currentView === 'routine' ? (
                            <button onClick={() => setShowVolume(!showVolume)} className={`p-2 -mr-2 transition-colors ${showVolume ? 'text-accent' : 'text-slate-400'}`}>
                                <Icons.Chart />
                            </button>
                        ) : (
                            <div className="w-10"></div>
                        )}
                    </div>

                    {/* MAIN CONTENT AREA */}
                    <div className="flex-1 overflow-y-auto px-4 pt-4 relative bg-dark">
                        
                        {currentView === 'routine' && (
                            <div className="space-y-3 pb-24">
                                
                                {/* BARRA DEL VOLUME (Nascosta di default, si apre con il tasto) */}
                                {showVolume && (Object.keys(currentVolume.primary).length > 0 || Object.keys(currentVolume.secondary).length > 0) && (
                                    <div className="flex flex-col gap-2 mb-3 p-3 bg-slate-800/80 rounded-xl border border-slate-700 shadow-inner animate-[slideIn_0.2s_ease-out]">
                                        {Object.keys(currentVolume.primary).length > 0 && (
                                            <div>
                                                <div className="w-full text-[10px] text-accent font-bold uppercase mb-1 px-1">Volume Principale (Serie)</div>
                                                <div className="flex flex-wrap gap-2">
                                                    {Object.entries(currentVolume.primary).map(([muscle, sets]) => (
                                                        <div key={`p-${muscle}`} className="flex items-center bg-card px-2 py-1 rounded border border-slate-700/50 shadow-sm">
                                                            <span className="text-slate-400 font-medium text-xs mr-1.5">{MUSCLE_ABBR[muscle] || muscle}:</span>
                                                            <span className="text-accent font-bold text-sm">{sets}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                        {Object.keys(currentVolume.secondary).length > 0 && (
                                            <div className="mt-1">
                                                <div className="w-full text-[10px] text-slate-400 font-bold uppercase mb-1 px-1">Coinvolti Multiarticolari</div>
                                                <div className="flex flex-wrap gap-2">
                                                    {Object.entries(currentVolume.secondary).map(([muscle, sets]) => (
                                                        <div key={`s-${muscle}`} className="flex items-center bg-card px-2 py-1 rounded border border-slate-700/50 shadow-sm">
                                                            <span className="text-slate-500 font-medium text-xs mr-1.5">{MUSCLE_ABBR[muscle] || muscle}:</span>
                                                            <span className="text-slate-300 font-bold text-sm">{sets}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* LISTA ESERCIZI */}
                                {activeRoutine.exercises.length === 0 ? (
                                    <div className="text-center text-slate-500 mt-10"><p>Nessun esercizio presente.</p><p>Premi il tasto + per iniziare.</p></div>
                                ) : (
                                    activeRoutine.exercises.map((ex, idx) => (
                                        <ExerciseCard 
                                            key={ex.id} 
                                            ex={ex} 
                                            idx={idx}
                                            isCompleted={completedExercises[ex.id]}
                                            onToggleComplete={() => toggleCompletion(ex.id)}
                                            onEdit={() => { setEditingExercise(ex); setIsModalOpen(true); }} 
                                            onDelete={() => deleteExercise(ex.id)}
                                            onMoveUp={() => moveExercise(idx, -1)}
                                            onMoveDown={() => moveExercise(idx, 1)}
                                            isFirst={idx === 0}
                                            isLast={idx === activeRoutine.exercises.length - 1}
                                        />
                                    ))
                                )}

                                {activeRoutine.exercises.length > 0 && (
                                    <button onClick={finishWorkout} className="w-full mt-6 bg-accent text-white font-bold py-3.5 rounded-xl shadow-lg flex items-center justify-center gap-2 active:bg-emerald-600 transition-colors">
                                        <Icons.Check /> Termina Allenamento
                                    </button>
                                )}
                                
                                {/* Spacer per annullare phantom scroll */}
                                <div className="h-6 w-full safe-bottom-padding"></div>
                            </div>
                        )}

                        {/* VISTA STORICO E ALTRE VISTE OMESSE PER BREVITA' MA INTATTE LOGICAMENTE */}
                        {currentView === 'history' && <div className="pb-10"><AnalyticsHistoryView history={data.history} setData={setData} setDialog={setDialog} /></div>}
                        {currentView === 'analytics' && <div className="pb-10"><AnalyticsStatsView history={data.history} setData={setData} setDialog={setDialog} /></div>}
                        {currentView === 'landmarks' && <div className="pb-10"><LandmarksView /></div>}
                        
                    </div>

                    {/* FLOATING ACTION BUTTON Z-INDEX ALTO PER NON SPARIRE */}
                    {currentView === 'routine' && (
                        <div className="absolute bottom-6 safe-bottom-padding left-0 w-full flex justify-center pointer-events-none z-[60]">
                            <button onClick={() => { setEditingExercise(null); setIsModalOpen(true); }} className="pointer-events-auto bg-accent text-white w-14 h-14 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(16,185,129,0.5)] active:scale-95 transition-transform">
                                <Icons.Plus />
                            </button>
                        </div>
                    )}

                    {/* MENU LATERALE */}
                    {isMenuOpen && (
                        <div className="fixed inset-0 z-[80] flex">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setIsMenuOpen(false)}></div>
                            <div className="w-[85%] max-w-sm bg-dark h-full relative flex flex-col shadow-2xl border-r border-slate-800 animate-[slideIn_0.2s_ease-out]">
                                <div className="p-6 safe-top-padding border-b border-slate-800 flex justify-between items-center">
                                    <h2 className="text-xl font-bold text-white">Menu</h2>
                                    <button onClick={() => setIsMenuOpen(false)} className="text-slate-400 p-2 -mr-2"><Icons.Close /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto py-4">
                                    <div className="px-6 pb-2 flex justify-between items-center">
                                        <span className="text-xs font-bold text-slate-500 uppercase">Le tue Schede</span>
                                        <button onClick={addRoutine} className="text-accent text-2xl leading-none active:scale-90 font-light p-1">+</button>
                                    </div>
                                    
                                    {Object.values(data.routines).map(routine => (
                                        <div key={routine.id} className="relative">
                                            <MenuButton 
                                                label={routine.name} 
                                                active={currentView === 'routine' && activeRoutineId === routine.id} 
                                                onClick={() => { setActiveRoutineId(routine.id); setCurrentView('routine'); setIsMenuOpen(false); }} 
                                            />
                                            <button 
                                                onClick={() => deleteRoutine(routine.id, routine.name)}
                                                className="absolute right-4 top-1/2 -translate-y-1/2 p-2 text-slate-500 hover:text-red-400 active:scale-90 transition-colors"
                                            >
                                                <Icons.Trash />
                                            </button>
                                        </div>
                                    ))}
                                    
                                    <div className="px-6 pt-6 pb-2 text-xs font-bold text-slate-500 uppercase">Progresso</div>
                                    <MenuButton label="Storico Allenamenti" active={currentView === 'history'} onClick={() => { setCurrentView('history'); setIsMenuOpen(false); }} />
                                    <MenuButton label="Analisi Muscolare" active={currentView === 'analytics'} onClick={() => { setCurrentView('analytics'); setIsMenuOpen(false); }} />
                                    
                                    <div className="px-6 pt-6 pb-2 text-xs font-bold text-slate-500 uppercase">Risorse</div>
                                    <MenuButton label="Landmark Volume" active={currentView === 'landmarks'} onClick={() => { setCurrentView('landmarks'); setIsMenuOpen(false); }} />
                                </div>
                            </div>
                        </div>
                    )}

                    {isModalOpen && <ExerciseFormModal exercise={editingExercise} onClose={() => setIsModalOpen(false)} onSave={saveExercise} />}
                    <CustomDialog dialog={dialog} onClose={() => setDialog(null)} />
                </div>
            );
        }

        // --- STREAMING_CHUNK:Componente ExerciseCard Ridimensionato e Migliorato... ---
        function ExerciseCard({ ex, idx, isCompleted, onToggleComplete, onEdit, onDelete, onMoveUp, onMoveDown, isFirst, isLast }) {
            const [swipeX, setSwipeX] = useState(0);
            const [showDetails, setShowDetails] = useState(false);

            const handleTouchStart = (e) => e.currentTarget.dataset.startX = e.touches[0].clientX;
            const handleTouchMove = (e) => {
                const startX = parseFloat(e.currentTarget.dataset.startX);
                const diff = e.touches[0].clientX - startX;
                if (diff < 0) setSwipeX(Math.max(diff, -80));
            };
            const handleTouchEnd = () => {
                if (swipeX <= -60) onDelete();
                setSwipeX(0); 
            };

            return (
                <div className="relative mb-3">
                    <div className="absolute inset-0 bg-red-500 rounded-xl flex justify-end items-center px-5">
                        <Icons.Trash />
                    </div>
                    
                    <div 
                        onTouchStart={handleTouchStart}
                        onTouchMove={handleTouchMove}
                        onTouchEnd={handleTouchEnd}
                        style={{ transform: `translateX(${swipeX}px)`, transition: swipeX === 0 ? 'transform 0.2s ease-out' : 'none' }}
                        className={`bg-card rounded-xl shadow-sm border border-slate-700/50 relative z-10 w-full touch-pan-y overflow-hidden transition-all duration-300 ${isCompleted ? 'opacity-50 grayscale-[30%]' : 'opacity-100'}`}
                    >
                        {/* Intestazione Riga Superiore */}
                        <div className="flex items-center p-3 pb-2 gap-3">
                            <button onClick={onToggleComplete} className="text-slate-400 p-1 active:scale-90 transition-transform shrink-0">
                                {isCompleted ? <Icons.CheckCircle /> : <Icons.Circle />}
                            </button>
                            
                            <h3 onClick={onEdit} className="font-bold text-base text-white truncate flex-1 leading-tight">
                                {idx + 1}. {ex.name}
                            </h3>
                            
                            <div className="flex gap-1 shrink-0">
                                {ex.video && (
                                    <a href={ex.video} target="_blank" className="p-1.5 text-slate-400 hover:text-accent"><Icons.Video /></a>
                                )}
                                <button onClick={() => setShowDetails(!showDetails)} className={`p-1.5 rounded-full transition-colors ${showDetails ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-white'}`}>
                                    <Icons.Info />
                                </button>
                            </div>
                        </div>

                        {/* Griglia Dati (Sempre Visibile) */}
                        <div className="grid grid-cols-4 gap-1 text-center px-3 pb-3" onClick={onEdit}>
                            <div className="bg-dark rounded p-1 flex flex-col justify-center min-h-[64px]">
                                <div className="text-[10px] text-slate-400 uppercase leading-none mt-1">Ser</div>
                                <div className="font-semibold text-white text-sm my-auto">{ex.sets}</div>
                                <div className="text-[8px] opacity-0 text-transparent mt-auto leading-none">00/00</div>
                            </div>
                            <div className="bg-dark rounded p-1 flex flex-col justify-center min-h-[64px]">
                                <div className="text-[10px] text-slate-400 uppercase leading-none mt-1">Rep</div>
                                <div className="font-semibold text-white text-sm my-auto">{ex.reps}</div>
                                {ex.repsDate ? <div className="text-[8px] text-accent/80 mt-auto leading-none">{ex.repsDate}</div> : <div className="text-[8px] opacity-0 mt-auto leading-none">00/00</div>}
                            </div>
                            <div className="bg-dark rounded p-1 flex flex-col justify-center min-h-[64px]">
                                <div className="text-[10px] text-slate-400 uppercase leading-none mt-1">Kg</div>
                                <div className="font-semibold text-white text-sm my-auto">{ex.weight}</div>
                                {ex.weightDate ? <div className="text-[8px] text-accent/80 mt-auto leading-none">{ex.weightDate}</div> : <div className="text-[8px] opacity-0 mt-auto leading-none">00/00</div>}
                            </div>
                            <div className="bg-dark rounded p-1 flex flex-col justify-center min-h-[64px]">
                                <div className="text-[10px] text-slate-400 uppercase leading-none mt-1">Rec</div>
                                <div className="font-semibold text-white text-sm my-auto">{ex.rest}"</div>
                                <div className="text-[8px] opacity-0 text-transparent mt-auto leading-none">00/00</div>
                            </div>
                        </div>

                        {/* Dettagli Espansi (Muscoli, Note, Spostamento) */}
                        {showDetails && (
                            <div className="px-3 pb-3 pt-2 border-t border-slate-700/50 bg-slate-800/30 animate-[fadeIn_0.2s_ease-out]">
                                <div className="flex justify-between items-start">
                                    <div className="flex-1 pr-3">
                                        <div className="flex flex-wrap gap-1 text-[10px] items-center mb-2">
                                            <span className="bg-accent/20 text-accent px-1.5 py-0.5 rounded">Prin: {ex.primaryMuscle}</span>
                                            {ex.secondaryMuscles && ex.secondaryMuscles.length > 0 && (
                                                <span className="bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded">Multi: {ex.secondaryMuscles.join(', ')}</span>
                                            )}
                                        </div>
                                        {ex.notes ? (
                                            <p className="text-xs text-slate-400 italic line-clamp-3">"{ex.notes}"</p>
                                        ) : (
                                            <p className="text-xs text-slate-600 italic">Nessuna nota</p>
                                        )}
                                    </div>
                                    
                                    {/* Pulsanti Spostamento */}
                                    <div className="flex flex-col gap-1 border-l border-slate-700 pl-3">
                                        <button onClick={onMoveUp} disabled={isFirst} className={`p-2 rounded-lg bg-dark border border-slate-700 flex justify-center items-center ${isFirst ? 'opacity-30' : 'active:bg-slate-700 text-white'}`}>
                                            <Icons.Up />
                                        </button>
                                        <button onClick={onMoveDown} disabled={isLast} className={`p-2 rounded-lg bg-dark border border-slate-700 flex justify-center items-center ${isLast ? 'opacity-30' : 'active:bg-slate-700 text-white'}`}>
                                            <Icons.Down />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function MenuButton({ label, active, onClick }) {
            return (
                <button onClick={onClick} className={`w-full text-left pl-6 pr-14 py-4 text-base transition-colors truncate ${active ? 'bg-card text-accent border-l-4 border-accent font-bold' : 'text-slate-300 hover:bg-slate-800'}`}>
                    {label}
                </button>
            );
        }

        // --- STREAMING_CHUNK:Viste Aggiuntive (Storico e Statistiche)... ---
        function AnalyticsHistoryView({ history, setData, setDialog }) {
            const resetHistory = () => {
                setDialog({
                    type: 'confirm', message: "Sei sicuro di voler eliminare tutto lo storico? L'azione è irreversibile.",
                    onCancel: () => setDialog(null),
                    onConfirm: () => { setData(prev => ({ ...prev, history: [] })); setDialog(null); }
                });
            };

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center px-1">
                        <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wide">Cronologia</h2>
                        {history.length > 0 && (
                            <button onClick={resetHistory} className="text-[10px] uppercase font-bold tracking-wider bg-red-500/10 text-red-400 px-3 py-1.5 rounded-lg border border-red-500/20 active:bg-red-500/30">
                                Reset
                            </button>
                        )}
                    </div>
                    {history.length === 0 ? (
                        <p className="text-center text-slate-500 mt-10">Nessun allenamento salvato.</p>
                    ) : (
                        history.map(record => (
                            <div key={record.id} className="bg-card rounded-xl p-4 shadow-lg border border-slate-700/50">
                                <div className="flex justify-between items-center mb-3 border-b border-slate-700 pb-2">
                                    <h3 className="font-bold text-white">{record.dateStr}</h3>
                                    <span className="text-xs font-bold bg-slate-700 px-2 py-1 rounded text-accent">{record.routineName}</span>
                                </div>
                                <div className="text-sm text-slate-300 space-y-2">
                                    {record.exercises.map((ex, i) => (
                                        <div key={i} className="flex justify-between items-center bg-dark/50 p-2 rounded-lg border border-slate-700/30">
                                            <div>
                                                <span className="font-semibold text-white block mb-0.5">{ex.name}</span>
                                                <span className="text-xs text-slate-400">{ex.sets}x{ex.reps} • Rec: {ex.rest}"</span>
                                            </div>
                                            <span className="text-accent font-bold whitespace-nowrap">{ex.weight} Kg</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))
                    )}
                </div>
            );
        }

        function AnalyticsStatsView({ history, setData, setDialog }) {
             const resetHistory = () => {
                setDialog({
                    type: 'confirm', message: "Sei sicuro di voler eliminare tutto lo storico? Questo azzererà le statistiche.",
                    onCancel: () => setDialog(null),
                    onConfirm: () => { setData(prev => ({ ...prev, history: [] })); setDialog(null); }
                });
            };

            const weeklyStats = useMemo(() => {
                const getMonday = (d) => {
                    const date = new Date(d);
                    const day = date.getDay();
                    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
                    return new Date(date.setDate(diff));
                };
                const formatDate = (date) => `${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')}`;
                
                const weeks = {};
                history.forEach(workout => {
                    const mon = getMonday(workout.date);
                    const sun = new Date(mon);
                    sun.setDate(sun.getDate() + 6);
                    const weekLabel = `Sett. ${formatDate(mon)} - ${formatDate(sun)}`;

                    if (!weeks[weekLabel]) {
                        weeks[weekLabel] = {};
                        MUSCLE_GROUPS.forEach(m => weeks[weekLabel][m] = { primary: 0, secondary: 0 });
                    }

                    workout.exercises.forEach(ex => {
                        const setsNum = parseInt(ex.sets, 10) || 0;
                        if(weeks[weekLabel][ex.primaryMuscle]) weeks[weekLabel][ex.primaryMuscle].primary += setsNum;
                        if(ex.secondaryMuscles) {
                            ex.secondaryMuscles.forEach(sm => {
                                if(weeks[weekLabel][sm]) weeks[weekLabel][sm].secondary += setsNum;
                            });
                        }
                    });
                });
                return weeks;
            }, [history]);

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center bg-card rounded-xl p-3 border border-slate-700 shadow-md">
                        <span className="text-xs text-slate-300">Totale <strong>Serie</strong> per settimana (Lun-Dom).</span>
                        {history.length > 0 && (
                            <button onClick={resetHistory} className="text-[10px] uppercase font-bold tracking-wider bg-red-500/10 text-red-400 px-3 py-1.5 rounded-lg border border-red-500/20">
                                Reset
                            </button>
                        )}
                    </div>
                    {Object.keys(weeklyStats).length === 0 && <p className="text-center text-slate-500 mt-10">Completa un allenamento per vedere le statistiche.</p>}
                    {Object.entries(weeklyStats).map(([weekLabel, stats]) => (
                        <div key={weekLabel} className="space-y-3">
                            <h3 className="font-bold text-accent text-sm border-b border-slate-700 pb-1">{weekLabel}</h3>
                            {MUSCLE_GROUPS.map(muscle => {
                                const s = stats[muscle];
                                if (s.primary === 0 && s.secondary === 0) return null;
                                return (
                                    <div key={muscle} className="bg-card rounded-xl p-3 shadow-md flex justify-between items-center border border-slate-700/30">
                                        <span className="font-bold text-white text-base">{muscle}</span>
                                        <div className="text-right">
                                            <div className="text-accent text-sm font-bold">Prin: {s.primary} serie</div>
                                            {s.secondary > 0 && <div className="text-slate-400 text-xs">Multi: {s.secondary} serie</div>}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    ))}
                </div>
            );
        }

        function LandmarksView() {
            return (
                <div className="space-y-4">
                    <div className="bg-card rounded-xl p-4 border border-slate-700 shadow-md text-sm text-slate-300">
                        <h3 className="font-bold text-white mb-3 text-base">Riferimenti Volume (Serie/Settimana)</h3>
                        <ul className="space-y-2 text-xs">
                            <li><span className="text-emerald-400 font-bold bg-emerald-400/10 px-1 py-0.5 rounded">MEV</span> <strong className="text-white">Minimo Efficace:</strong> Inizio della crescita.</li>
                            <li><span className="text-blue-400 font-bold bg-blue-400/10 px-1 py-0.5 rounded">MAV</span> <strong className="text-white">Massimo Adattivo:</strong> Range ottimale.</li>
                            <li><span className="text-red-400 font-bold bg-red-400/10 px-1 py-0.5 rounded">MRV</span> <strong className="text-white">Massimo Recuperabile:</strong> Soglia limite.</li>
                        </ul>
                    </div>
                    <div className="space-y-2">
                        {MUSCLE_GROUPS.map(muscle => {
                            const lm = VOLUME_LANDMARKS[muscle];
                            if(!lm) return null;
                            return (
                                <div key={muscle} className="bg-card rounded-xl p-3 shadow-md flex justify-between items-center border border-slate-700/30">
                                    <span className="font-bold text-white text-sm truncate pr-2">{muscle}</span>
                                    <div className="flex gap-3 text-xs text-center shrink-0">
                                        <div className="w-8"><div className="text-emerald-400 font-bold">{lm.mev}</div><div className="text-slate-500 text-[10px]">MEV</div></div>
                                        <div className="w-8"><div className="text-blue-400 font-bold">{lm.mav}</div><div className="text-slate-500 text-[10px]">MAV</div></div>
                                        <div className="w-8"><div className="text-red-400 font-bold">{lm.mrv}</div><div className="text-slate-500 text-[10px]">MRV</div></div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // --- STREAMING_CHUNK:Modale Modifica Esercizio (Immutato)... ---
        function ExerciseFormModal({ exercise, onClose, onSave }) {
            const [formData, setFormData] = useState(exercise || {
                name: '', sets: 4, reps: '8-10', weight: 0, rest: 90,
                notes: '', video: '', primaryMuscle: 'Petto', secondaryMuscles: [],
                weightDate: '', repsDate: ''
            });

            const handleChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));
            
            const toggleSecondaryMuscle = (muscle) => {
                setFormData(prev => {
                    const list = prev.secondaryMuscles || [];
                    if (list.includes(muscle)) return { ...prev, secondaryMuscles: list.filter(m => m !== muscle) };
                    return { ...prev, secondaryMuscles: [...list, muscle] };
                });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!formData.name) return;
                
                const todayFormatted = `${String(new Date().getDate()).padStart(2, '0')}/${String(new Date().getMonth() + 1).padStart(2, '0')}`;
                
                let finalWeightDate = formData.weightDate;
                if (!exercise || String(exercise.weight) !== String(formData.weight) || !finalWeightDate) finalWeightDate = todayFormatted;
                
                let finalRepsDate = formData.repsDate;
                if (!exercise || String(exercise.reps) !== String(formData.reps) || !finalRepsDate) finalRepsDate = todayFormatted;

                onSave({ ...formData, weightDate: finalWeightDate, repsDate: finalRepsDate });
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="w-full sm:w-[400px] max-h-[90vh] bg-card rounded-t-3xl sm:rounded-3xl relative flex flex-col shadow-2xl border border-slate-700">
                        <div className="flex justify-between items-center p-4 border-b border-slate-700 safe-top-padding">
                            <h2 className="text-lg font-bold text-white">{exercise ? 'Modifica' : 'Nuovo Esercizio'}</h2>
                            <button type="button" onClick={onClose} className="p-2 -mr-2 text-slate-400"><Icons.Close /></button>
                        </div>
                        <div className="overflow-y-auto p-4 safe-bottom-padding">
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Nome Esercizio</label>
                                    <input type="text" name="name" value={formData.name} onChange={handleChange} className="w-full bg-dark text-white rounded-xl p-3 border border-slate-700 focus:border-accent focus:outline-none" required />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Serie</label>
                                        <input type="number" name="sets" value={formData.sets} onChange={handleChange} className="w-full bg-dark text-white rounded-xl p-3 border border-slate-700" />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Ripetizioni</label>
                                        <input type="text" name="reps" value={formData.reps} onChange={handleChange} className="w-full bg-dark text-white rounded-xl p-3 border border-slate-700" />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Peso (Kg)</label>
                                        <input type="number" step="0.5" name="weight" value={formData.weight} onChange={handleChange} className="w-full bg-dark text-white rounded-xl p-3 border border-slate-700" />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Recupero (sec)</label>
                                        <input type="number" name="rest" value={formData.rest} onChange={handleChange} className="w-full bg-dark text-white rounded-xl p-3 border border-slate-700" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Muscolo Principale</label>
                                    <select name="primaryMuscle" value={formData.primaryMuscle} onChange={handleChange} className="w-full bg-dark text-white rounded-xl p-3 border border-slate-700 appearance-none">
                                        {MUSCLE_GROUPS.map(m => <option key={m} value={m}>{m}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-2">Muscoli Coinvolti (Opzionale)</label>
                                    <div className="flex flex-wrap gap-2">
                                        {MUSCLE_GROUPS.filter(m => m !== formData.primaryMuscle).map(m => (
                                            <button key={m} type="button" onClick={() => toggleSecondaryMuscle(m)}
                                                className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${formData.secondaryMuscles.includes(m) ? 'bg-slate-700 border-slate-500 text-white' : 'bg-dark border-slate-800 text-slate-500'}`}>
                                                {m}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Link Video (Opzionale)</label>
                                    <input type="url" name="video" value={formData.video || ''} onChange={handleChange} placeholder="https://..." className="w-full bg-dark text-white rounded-xl p-3 border border-slate-700 focus:border-accent focus:outline-none" />
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Note (Opzionale)</label>
                                    <textarea name="notes" value={formData.notes} onChange={handleChange} rows="2" className="w-full bg-dark text-white rounded-xl p-3 border border-slate-700 focus:border-accent focus:outline-none"></textarea>
                                </div>
                                <div className="pt-2 pb-12">
                                    <button type="submit" className="w-full bg-accent text-white font-bold py-3.5 rounded-xl shadow-lg active:scale-95 transition-transform">
                                        Salva
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
